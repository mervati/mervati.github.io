<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SILVA · Painel Administrativo</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- ══════════════════ LOGIN ══════════════════ -->
  <div class="login-wrap" id="loginWrap">
    <div class="login-card">
      <h1>SILVA</h1>
      <p class="login-sub">Painel Administrativo · mervati.github.io</p>

      <div class="form-group">
        <label for="patInput">GitHub Personal Access Token</label>
        <input type="password" id="patInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
      </div>

      <button class="btn btn-primary" id="loginBtn" style="width:100%">Conectar</button>

      <p id="loginError" class="login-error"></p>

      <p class="login-help">
        Para criar um token acesse:
        <a href="https://github.com/settings/tokens/new" target="_blank" rel="noopener">
          github.com → Settings → Developer Settings → Personal Access Tokens
        </a><br>
        Marque o escopo <strong>repo</strong> e copie o token gerado.
      </p>
    </div>
  </div>

  <!-- ══════════════════ PAINEL ══════════════════ -->
  <div id="adminPanel" style="display:none; flex-direction:column; min-height:100vh;">

    <header class="admin-header">
      <span class="admin-header-title">SILVA · Painel Administrativo</span>
      <span class="admin-header-user" id="headerUser"></span>
      <div class="admin-header-actions">
        <button class="btn btn-primary btn-sm" id="saveBtn" disabled>💾 Salvar</button>
        <button class="btn btn-secondary btn-sm" id="logoutBtn">Sair</button>
      </div>
    </header>

    <div class="admin-body">

      <!-- Abas principais -->
      <div class="admin-nav">
        <button class="admin-nav-btn active" data-tab="projects">Projetos</button>
        <button class="admin-nav-btn"         data-tab="articles">Artigos</button>
      </div>

      <!-- ── Tab: Projetos ── -->
      <div id="tab-projects">
        <div class="cat-tabs">
          <button class="cat-tab active" data-cat="games">Jogos</button>
          <button class="cat-tab"        data-cat="programs">Programas</button>
          <button class="cat-tab"        data-cat="sites">Sites</button>
        </div>

        <div class="section-header">
          <h2 id="projectCatLabel">Jogos</h2>
          <button class="btn btn-primary btn-sm" id="newProjectBtn">+ Novo projeto</button>
        </div>
        <div class="item-list" id="projectList"></div>
      </div>

      <!-- ── Tab: Artigos ── -->
      <div id="tab-articles" style="display:none;">
        <div class="section-header">
          <h2>Artigos</h2>
          <button class="btn btn-primary btn-sm" id="newArticleBtn">+ Novo artigo</button>
        </div>
        <div class="item-list" id="articleList"></div>
      </div>

    </div>
  </div>

  <!-- ══════════════════ MODAL PROJETO ══════════════════ -->
  <div class="modal-overlay" id="projectModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="projectModalTitle">Projeto</h3>
        <button class="modal-close" id="closeProjectModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="pTitle" />
        </div>
        <div class="form-group">
          <label>Descrição</label>
          <textarea id="pDesc"></textarea>
        </div>
        <div class="form-group">
          <label>Link (URL de acesso)</label>
          <input type="url" id="pLink" placeholder="https://" />
        </div>
        <div class="form-group">
          <label>Imagem (caminho ou URL)</label>
          <input type="text" id="pImage" placeholder="images/nome.png" />
        </div>
        <div class="form-group">
          <label>Emoji fallback</label>
          <input type="text" id="pFallback" placeholder="🛸" maxlength="4" style="max-width:80px" />
        </div>
        <div class="form-group">
          <label>Repositório GitHub (para badges)</label>
          <input type="text" id="pRepo" placeholder="mervati/nome-do-repo" />
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="pStatus">
            <option value="orbit">EM ÓRBITA</option>
            <option value="published">PUBLICADO</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelProjectModal">Cancelar</button>
        <button class="btn btn-primary"   id="confirmProjectModal">Salvar projeto</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════ MODAL ARTIGO ══════════════════ -->
  <div class="modal-overlay" id="articleModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="articleModalTitle">Artigo</h3>
        <button class="modal-close" id="closeArticleModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="aTitle" />
        </div>
        <div class="form-group">
          <label>Tag (ex: IAM)</label>
          <input type="text" id="aTag" placeholder="IAM" />
        </div>
        <div class="form-group">
          <label>Classe da tag</label>
          <select id="aTagClass">
            <option value="iam">iam</option>
            <option value="lgpd">lgpd</option>
            <option value="sap">sap</option>
          </select>
        </div>
        <div class="form-group">
          <label>Categoria (para filtros, ex: iam lgpd)</label>
          <input type="text" id="aCategory" placeholder="iam lgpd" />
        </div>
        <div class="form-group">
          <label>Data</label>
          <input type="text" id="aDate" placeholder="maio 2026" />
        </div>
        <div class="form-group">
          <label>Tempo de leitura (minutos)</label>
          <input type="text" id="aReadtime" placeholder="2" style="max-width:80px" />
        </div>
        <div class="form-group">
          <label>Resumo (excerpt)</label>
          <textarea id="aExcerpt"></textarea>
        </div>
        <div class="form-group">
          <label>Conteúdo HTML</label>
          <textarea id="aBody" class="tall"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelArticleModal">Cancelar</button>
        <button class="btn btn-primary"   id="confirmArticleModal">Salvar artigo</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════ TOAST ══════════════════ -->
  <div class="toast" id="toast"></div>

  <!-- ══════════════════ SCRIPT ══════════════════ -->
  <script>
  (function () {
    'use strict';

    /* ── Constantes ── */
    const REPO_OWNER  = 'mervati';
    const REPO_NAME   = 'mervati.github.io';
    const CONTENT_PATH = 'content.json';
    const API_BASE    = 'https://api.github.com';

    /* ── Estado ── */
    let state         = null;   // cópia editável do content.json
    let contentSha    = null;   // SHA necessário para o PUT
    let ghToken       = null;
    let unsavedChanges = false;
    let activeCat     = 'games';
    let activeTab     = 'projects';

    /* ── Elementos ── */
    const loginWrap    = document.getElementById('loginWrap');
    const adminPanel   = document.getElementById('adminPanel');
    const patInput     = document.getElementById('patInput');
    const loginBtn     = document.getElementById('loginBtn');
    const loginError   = document.getElementById('loginError');
    const headerUser   = document.getElementById('headerUser');
    const saveBtn      = document.getElementById('saveBtn');
    const logoutBtn    = document.getElementById('logoutBtn');
    const projectList  = document.getElementById('projectList');
    const articleList  = document.getElementById('articleList');
    const toastEl      = document.getElementById('toast');

    /* ──────────────────────────────────────────
       AUTENTICAÇÃO
    ────────────────────────────────────────── */
    loginBtn.addEventListener('click', login);
    patInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

    async function login() {
      const token = patInput.value.trim();
      if (!token) { showLoginError('Cole o Personal Access Token antes de conectar.'); return; }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Verificando...';
      hideLoginError();

      try {
        const res = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}`, token);
        if (!res.ok) {
          const msg = res.status === 401 ? 'Token inválido ou sem permissão.'
                    : res.status === 404 ? 'Repositório não encontrado.'
                    : `Erro ${res.status} ao verificar o token.`;
          throw new Error(msg);
        }
        const repoData = await res.json();
        ghToken = token;
        sessionStorage.setItem('silva_token', token);

        headerUser.textContent = `Logado como ${repoData.owner?.login || 'desconhecido'}`;
        await loadContent();
        showPanel();
      } catch (err) {
        showLoginError(err.message || 'Erro de rede. Tente novamente.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Conectar';
      }
    }

    function showLoginError(msg) {
      loginError.textContent = msg;
      loginError.style.display = 'block';
    }

    function hideLoginError() {
      loginError.style.display = 'none';
    }

    logoutBtn.addEventListener('click', () => {
      if (unsavedChanges && !confirm('Há alterações não salvas. Sair mesmo assim?')) return;
      sessionStorage.removeItem('silva_token');
      ghToken = null;
      state   = null;
      contentSha = null;
      unsavedChanges = false;
      patInput.value = '';
      adminPanel.style.display = 'none';
      loginWrap.style.display  = 'flex';
    });

    /* ── Verificar token salvo na sessão ── */
    (async function tryAutoLogin() {
      const saved = sessionStorage.getItem('silva_token');
      if (!saved) return;
      patInput.value = saved;
      ghToken = saved;
      loginBtn.disabled = true;
      loginBtn.textContent = 'Reconectando...';
      try {
        const res = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}`, saved);
        if (!res.ok) throw new Error();
        const repoData = await res.json();
        headerUser.textContent = `Logado como ${repoData.owner?.login || 'desconhecido'}`;
        await loadContent();
        showPanel();
      } catch {
        sessionStorage.removeItem('silva_token');
        ghToken = null;
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Conectar';
      }
    })();

    /* ──────────────────────────────────────────
       CONTEÚDO — carregar / salvar
    ────────────────────────────────────────── */
    async function loadContent() {
      const res = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CONTENT_PATH}`);
      if (!res.ok) throw new Error(`Erro ${res.status} ao carregar content.json`);
      const json = await res.json();
      contentSha = json.sha;
      const decoded = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ''))));
      state = JSON.parse(decoded);
    }

    saveBtn.addEventListener('click', saveContent);

    async function saveContent() {
      if (!state || !contentSha) return;
      saveBtn.disabled = true;
      saveBtn.textContent = '💾 Salvando...';

      try {
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(state, null, 2))));
        const res = await ghFetch(
          `/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CONTENT_PATH}`,
          ghToken,
          {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: 'chore: atualiza content.json via SILVA',
              content: encoded,
              sha: contentSha
            })
          }
        );

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `Erro ${res.status} ao salvar.`);
        }

        const data = await res.json();
        contentSha = data.content.sha;
        unsavedChanges = false;
        saveBtn.disabled = true;
        showToast('Salvo com sucesso!', 'success');
      } catch (err) {
        showToast(err.message || 'Erro ao salvar.', 'error');
      } finally {
        saveBtn.textContent = '💾 Salvar';
      }
    }

    function markUnsaved() {
      unsavedChanges = true;
      saveBtn.disabled = false;
    }

    /* ──────────────────────────────────────────
       NAVEGAÇÃO (abas)
    ────────────────────────────────────────── */
    function showPanel() {
      loginWrap.style.display  = 'none';
      adminPanel.style.display = 'flex';
      renderProjectList(activeCat);
      renderArticleList();
    }

    document.querySelectorAll('.admin-nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.admin-nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        document.getElementById('tab-projects').style.display = activeTab === 'projects' ? '' : 'none';
        document.getElementById('tab-articles').style.display = activeTab === 'articles' ? '' : 'none';
      });
    });

    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeCat = tab.dataset.cat;
        const labels = { games: 'Jogos', programs: 'Programas', sites: 'Sites' };
        document.getElementById('projectCatLabel').textContent = labels[activeCat] || activeCat;
        renderProjectList(activeCat);
      });
    });

    /* ──────────────────────────────────────────
       RENDER — Projetos
    ────────────────────────────────────────── */
    function renderProjectList(cat) {
      if (!state) return;
      const list = (state.projects || {})[cat] || [];
      if (list.length === 0) {
        projectList.innerHTML = '<div class="empty-state">Nenhum projeto nesta categoria.</div>';
        return;
      }
      projectList.innerHTML = list.map((p, i) => `
        <div class="item-row">
          <div class="item-info">
            <div class="item-title">${esc(p.title)}</div>
            <div class="item-meta">${esc(p.desc || '')}</div>
          </div>
          <span class="status-pill ${p.status === 'published' ? 'published' : 'orbit'}"
                title="Clique para alternar status"
                data-action="toggle-status" data-index="${i}">
            ${p.status === 'published' ? 'PUBLICADO' : 'EM ÓRBITA'}
          </span>
          <div class="item-actions">
            <button class="btn btn-secondary btn-sm" data-action="edit-project" data-index="${i}">Editar</button>
            <button class="btn btn-danger   btn-sm" data-action="del-project"  data-index="${i}">Excluir</button>
          </div>
        </div>
      `).join('');

      /* Delegação de eventos */
      projectList.querySelectorAll('[data-action]').forEach(el => {
        el.addEventListener('click', () => {
          const idx    = parseInt(el.dataset.index);
          const action = el.dataset.action;
          if (action === 'edit-project')   openProjectModal(idx);
          if (action === 'del-project')    deleteProject(idx);
          if (action === 'toggle-status')  toggleStatus(idx);
        });
      });
    }

    /* ──────────────────────────────────────────
       RENDER — Artigos
    ────────────────────────────────────────── */
    function renderArticleList() {
      if (!state) return;
      const list = state.articles || [];
      if (list.length === 0) {
        articleList.innerHTML = '<div class="empty-state">Nenhum artigo cadastrado.</div>';
        return;
      }
      articleList.innerHTML = list.map((a, i) => `
        <div class="item-row">
          <div class="item-info">
            <div class="item-title">${esc(a.title)}</div>
            <div class="item-meta">
              <span class="status-pill published" style="margin-right:6px;">${esc(a.tag)}</span>
              ${esc(a.date)} · ${esc(a.readtime)} min
            </div>
          </div>
          <div class="item-actions">
            <button class="btn btn-secondary btn-sm" data-action="edit-article" data-index="${i}">Editar</button>
            <button class="btn btn-danger   btn-sm" data-action="del-article"  data-index="${i}">Excluir</button>
          </div>
        </div>
      `).join('');

      articleList.querySelectorAll('[data-action]').forEach(el => {
        el.addEventListener('click', () => {
          const idx    = parseInt(el.dataset.index);
          const action = el.dataset.action;
          if (action === 'edit-article') openArticleModal(idx);
          if (action === 'del-article')  deleteArticle(idx);
        });
      });
    }

    /* ──────────────────────────────────────────
       MODAL PROJETO
    ────────────────────────────────────────── */
    let editingProjectIndex = null;

    document.getElementById('newProjectBtn').addEventListener('click', () => openProjectModal(null));
    document.getElementById('closeProjectModal').addEventListener('click', closeProjectModal);
    document.getElementById('cancelProjectModal').addEventListener('click', closeProjectModal);
    document.getElementById('confirmProjectModal').addEventListener('click', confirmProject);

    function openProjectModal(index) {
      editingProjectIndex = index;
      const isNew = index === null;
      document.getElementById('projectModalTitle').textContent = isNew ? 'Novo Projeto' : 'Editar Projeto';

      if (!isNew) {
        const p = (state.projects[activeCat] || [])[index] || {};
        document.getElementById('pTitle').value    = p.title    || '';
        document.getElementById('pDesc').value     = p.desc     || '';
        document.getElementById('pLink').value     = p.link     || '';
        document.getElementById('pImage').value    = p.image    || '';
        document.getElementById('pFallback').value = p.fallback || '';
        document.getElementById('pRepo').value     = p.repo     || '';
        document.getElementById('pStatus').value   = p.status   || 'orbit';
      } else {
        document.getElementById('pTitle').value    = '';
        document.getElementById('pDesc').value     = '';
        document.getElementById('pLink').value     = '';
        document.getElementById('pImage').value    = '';
        document.getElementById('pFallback').value = '';
        document.getElementById('pRepo').value     = '';
        document.getElementById('pStatus').value   = 'orbit';
      }

      document.getElementById('projectModal').classList.add('open');
    }

    function closeProjectModal() {
      document.getElementById('projectModal').classList.remove('open');
    }

    function confirmProject() {
      const data = {
        id:       slugify(document.getElementById('pTitle').value),
        title:    document.getElementById('pTitle').value.trim(),
        desc:     document.getElementById('pDesc').value.trim(),
        link:     document.getElementById('pLink').value.trim(),
        image:    document.getElementById('pImage').value.trim(),
        fallback: document.getElementById('pFallback').value.trim(),
        repo:     document.getElementById('pRepo').value.trim(),
        status:   document.getElementById('pStatus').value
      };

      if (!data.title) { alert('O título é obrigatório.'); return; }
      saveProject(data);
      closeProjectModal();
    }

    function saveProject(data) {
      if (!state.projects[activeCat]) state.projects[activeCat] = [];
      if (editingProjectIndex !== null) {
        state.projects[activeCat][editingProjectIndex] = data;
      } else {
        state.projects[activeCat].push(data);
      }
      markUnsaved();
      renderProjectList(activeCat);
    }

    /* ──────────────────────────────────────────
       MODAL ARTIGO
    ────────────────────────────────────────── */
    let editingArticleIndex = null;

    document.getElementById('newArticleBtn').addEventListener('click', () => openArticleModal(null));
    document.getElementById('closeArticleModal').addEventListener('click', closeArticleModal);
    document.getElementById('cancelArticleModal').addEventListener('click', closeArticleModal);
    document.getElementById('confirmArticleModal').addEventListener('click', confirmArticle);

    function openArticleModal(index) {
      editingArticleIndex = index;
      const isNew = index === null;
      document.getElementById('articleModalTitle').textContent = isNew ? 'Novo Artigo' : 'Editar Artigo';

      if (!isNew) {
        const a = (state.articles || [])[index] || {};
        document.getElementById('aTitle').value    = a.title    || '';
        document.getElementById('aTag').value      = a.tag      || '';
        document.getElementById('aTagClass').value = a.tagClass || 'iam';
        document.getElementById('aCategory').value = a.category || '';
        document.getElementById('aDate').value     = a.date     || '';
        document.getElementById('aReadtime').value = a.readtime || '';
        document.getElementById('aExcerpt').value  = a.excerpt  || '';
        document.getElementById('aBody').value     = a.body     || '';
      } else {
        document.getElementById('aTitle').value    = '';
        document.getElementById('aTag').value      = '';
        document.getElementById('aTagClass').value = 'iam';
        document.getElementById('aCategory').value = '';
        document.getElementById('aDate').value     = '';
        document.getElementById('aReadtime').value = '';
        document.getElementById('aExcerpt').value  = '';
        document.getElementById('aBody').value     = '';
      }

      document.getElementById('articleModal').classList.add('open');
    }

    function closeArticleModal() {
      document.getElementById('articleModal').classList.remove('open');
    }

    function confirmArticle() {
      const maxId = (state.articles || []).reduce((m, a) => Math.max(m, a.id || 0), 0);
      const data = {
        id:       editingArticleIndex !== null ? state.articles[editingArticleIndex].id : maxId + 1,
        tag:      document.getElementById('aTag').value.trim(),
        tagClass: document.getElementById('aTagClass').value,
        category: document.getElementById('aCategory').value.trim(),
        date:     document.getElementById('aDate').value.trim(),
        readtime: document.getElementById('aReadtime').value.trim(),
        title:    document.getElementById('aTitle').value.trim(),
        excerpt:  document.getElementById('aExcerpt').value.trim(),
        body:     document.getElementById('aBody').value.trim()
      };

      if (!data.title) { alert('O título é obrigatório.'); return; }
      saveArticle(data);
      closeArticleModal();
    }

    function saveArticle(data) {
      if (!state.articles) state.articles = [];
      if (editingArticleIndex !== null) {
        state.articles[editingArticleIndex] = data;
      } else {
        state.articles.push(data);
      }
      markUnsaved();
      renderArticleList();
    }

    /* ──────────────────────────────────────────
       AÇÕES — deletar / toggle status
    ────────────────────────────────────────── */
    function deleteProject(i) {
      if (!confirm('Excluir este projeto?')) return;
      (state.projects[activeCat] || []).splice(i, 1);
      markUnsaved();
      renderProjectList(activeCat);
    }

    function deleteArticle(i) {
      if (!confirm('Excluir este artigo?')) return;
      state.articles.splice(i, 1);
      markUnsaved();
      renderArticleList();
    }

    function toggleStatus(i) {
      const list = state.projects[activeCat];
      if (!list || !list[i]) return;
      list[i].status = list[i].status === 'published' ? 'orbit' : 'published';
      markUnsaved();
      renderProjectList(activeCat);
    }

    /* ──────────────────────────────────────────
       FECHAR MODAIS com ESC / clique fora
    ────────────────────────────────────────── */
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      closeProjectModal();
      closeArticleModal();
    });

    document.getElementById('projectModal').addEventListener('click', e => {
      if (e.target === document.getElementById('projectModal')) closeProjectModal();
    });

    document.getElementById('articleModal').addEventListener('click', e => {
      if (e.target === document.getElementById('articleModal')) closeArticleModal();
    });

    /* ──────────────────────────────────────────
       TOAST
    ────────────────────────────────────────── */
    let toastTimer = null;

    function showToast(msg, type) {
      toastEl.textContent = msg;
      toastEl.className   = 'toast show' + (type ? ' toast-' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastEl.classList.remove('show'); }, 3500);
    }

    /* ──────────────────────────────────────────
       UTILITÁRIOS
    ────────────────────────────────────────── */
    function ghFetch(path, tokenOrOverride, options) {
      /* Aceita ghFetch(path) usando ghToken global,
         ou ghFetch(path, token) para auto-login */
      const token = typeof tokenOrOverride === 'string' ? tokenOrOverride : ghToken;
      const opts  = (typeof tokenOrOverride === 'object' && tokenOrOverride !== null)
                    ? tokenOrOverride
                    : (options || {});
      const headers = Object.assign({ Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }, opts.headers || {});
      return fetch(API_BASE + path, Object.assign({}, opts, { headers }));
    }

    function esc(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function slugify(str) {
      return String(str || '').toLowerCase().trim()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

  })();
  </script>
